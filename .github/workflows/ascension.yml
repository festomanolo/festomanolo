name: Ascension

on:
  schedule:
    - cron: "17 */12 * * *"   # twice a day
  workflow_dispatch:           # run it by hand from the Actions tab
  push:
    branches: [main]
    paths:
      - "forge/**"
      - ".github/workflows/ascension.yml"

permissions:
  contents: write

concurrency:
  group: ascension
  cancel-in-progress: true

jobs:
  ascend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Raise the city from your year
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python forge/ascension.py --user "${{ github.repository_owner }}" --out assets/ascension.svg
          python forge/arsenal.py
          python forge/brand.py

      - name: Commit the pilgrimage
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --cached --quiet && echo "Nothing new to ascend." && exit 0
          git commit -m "chore: ascension [skip ci]"
          git push
